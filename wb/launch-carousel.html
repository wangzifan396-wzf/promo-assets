<script>
  const slides=[...document.querySelectorAll('.slide')];
  const dots=[...document.querySelectorAll('.dot')];
  const cap=document.getElementById('cap');
  const titles=slides.map(s=>s.dataset.title);
  let i=0;
  function show(n){i=(n+slides.length)%slides.length;
    slides.forEach((s,k)=>s.classList.toggle('active',k===i));
    dots.forEach((d,k)=>d.classList.toggle('active',k===i));
    cap.textContent=(i+1)+' / '+slides.length+' · '+titles[i];}
  document.getElementById('next').onclick=()=>show(i+1);
  document.getElementById('prev').onclick=()=>show(i-1);
  dots.forEach((d,k)=>d.onclick=()=>show(k));
  addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);
    if(e.key==='ArrowLeft')show(i-1);});
  // touch swipe
  let x0=null;const st=document.getElementById('stage');
  st.addEventListener('touchstart',e=>x0=e.touches[0].clientX);
  st.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;
    if(dx>40)show(i-1);if(dx<-40)show(i+1);x0=null;});
  show(0);
</script></body></html>
